name: Alternative Ventures USA preview guard
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/us/**'
      - 'docs/usa-netlify-first-deploy-handoff-20261029.md'
      - 'scripts/verify-usa-portfolio.mjs'
      - '.github/workflows/usa-portfolio-guard.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin review tests to the actual PR HEAD, never GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Attest exact PR HEAD checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-usa-portfolio.mjs
